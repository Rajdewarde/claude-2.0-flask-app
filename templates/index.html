<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sarathi AI — a bilingual English/Marathi AI chat assistant.">
    <meta name="theme-color" content="#14152B">
    <meta name="google-site-verification" content="COkqcA7sqCVVG9t38mbhivA_dgqNfhRRj6ISosQQTUs" />
    <title>{{ config.APP_NAME }}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <!-- Fonts: Yatra One for the brand mark/headings, Manrope for everything else -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Highlight.js Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Marked.js Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- KaTeX Math Renderer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="btn-new-chat" id="newChatBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    <span>New Chat</span>
                </button>
                <button class="icon-btn mobile-only" id="closeSidebarBtn" aria-label="Close sidebar">✕</button>
            </div>

            <div class="search-box">
                <input type="text" id="searchConversations" placeholder="Search chats..." aria-label="Search chats">
            </div>

            <nav class="chat-history-list" id="chatHistoryList" aria-label="Conversation History"></nav>

            <div class="sidebar-footer">
                <button class="usage-badge" id="usageBadge" aria-label="View plan and usage">
                    <span>
                        <span class="plan-name" id="usagePlanName">Yatri</span>
                        <div class="usage-bar-track"><div class="usage-bar-fill" id="usageBarFill" style="width:0%"></div></div>
                    </span>
                    <span class="usage-count" id="usageCount">0/15</span>
                </button>
                <div class="user-profile-bar" id="userProfileBar">
                    <button class="btn-auth" id="openAuthModalBtn">Sign In / Register</button>
                </div>
                <button class="nav-item" id="openPlansBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5 2.3-7.2-6-4.6h7.6z"/></svg>
                    <span>Plans</span>
                </button>
                <button class="nav-item" id="openSettingsBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-viewport">
            <header class="top-bar">
                <button class="icon-btn" id="toggleSidebarBtn" aria-label="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="brand-container">
                    <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="16" x2="20" y2="16"/><path d="M7 16a5 5 0 0 1 10 0"/><line x1="12" y1="6" x2="12" y2="8.5"/><line x1="7.6" y1="8.1" x2="9.1" y2="9.9"/><line x1="16.4" y1="8.1" x2="14.9" y2="9.9"/></svg>
                    <h1 class="app-brand" id="brandTitle">{{ config.APP_NAME }}</h1>
                </div>
                <div class="model-badge" id="currentModelDisplay">Sarathi Prime</div>
            </header>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <svg class="hero-mark" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="4" y1="16" x2="20" y2="16"/><path d="M7 16a5 5 0 0 1 10 0"/><line x1="12" y1="6" x2="12" y2="8.5"/><line x1="7.6" y1="8.1" x2="9.1" y2="9.9"/><line x1="16.4" y1="8.1" x2="14.9" y2="9.9"/></svg>
                    <h2>Where shall we go today?</h2>
                    <p class="subtitle">{{ config.APP_SUBTITLE }}</p>
                </div>
            </div>

            <!-- Input Controls Area -->
            <footer class="input-wrapper">
                <div class="active-doc-pill" id="activeDocPill" hidden>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                    <span id="activeDocName">document.pdf</span>
                    <button type="button" id="removeDocBtn" aria-label="Remove document">✕</button>
                </div>
                <div class="attachment-preview-strip" id="attachmentPreview"></div>
                <div class="input-card">
                    <textarea id="promptInput" rows="1" placeholder="Reply to {{ config.APP_NAME }}..." aria-label="Message Input"></textarea>
                    <div class="input-actions">
                        <label class="icon-btn" title="Attach image file">
                            <input type="file" id="fileAttachInput" hidden accept="image/*">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </label>
                        <label class="icon-btn" title="Chat with a PDF/text document">
                            <input type="file" id="docAttachInput" hidden accept=".pdf,.txt,.md">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
                        </label>
                        <span class="char-counter" id="charCounter">0/4000</span>
                        <button class="btn-send" id="sendBtn" aria-label="Send Message" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <!-- Modal Login / Sign Up Dialog -->
    <dialog class="modal" id="authModal">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="authTitle">Sign In</h2>
                <button class="icon-btn" id="closeAuthBtn">✕</button>
            </header>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="authEmail">Email Address</label>
                    <input type="email" id="authEmail" placeholder="name@example.com">
                </div>
                <div class="setting-group">
                    <label for="authPassword">Password</label>
                    <input type="password" id="authPassword" placeholder="••••••••">
                </div>
                <div class="auth-error-msg" id="authErrorMsg"></div>
                <div class="setting-group action-buttons">
                    <button class="btn-primary" id="authSubmitBtn">Sign In</button>
                    <p class="auth-toggle-text">Don't have an account? <a href="#" id="toggleAuthMode">Sign Up</a></p>
                </div>
            </div>
        </div>
    </dialog>

    <!-- Modal Settings Dialog -->
    <dialog class="modal" id="settingsModal">
        <div class="modal-content">
            <header class="modal-header">
                <h2>Settings</h2>
                <button class="icon-btn" id="closeSettingsBtn">✕</button>
            </header>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="themeSelect">Theme</label>
                    <select id="themeSelect">
                        <option value="auto">System / Auto</option>
                        <option value="light">Light Mode</option>
                        <option value="dark">Dark Mode</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="apiKeyInput">OpenRouter API Key (Optional Override)</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-or-v1-...">
                </div>
                <div class="setting-group">
                    <label for="modelSelect">AI Model</label>
                    <select id="modelSelect">
                        <option value="anthropic/claude-3.5-haiku">Sarathi Prime (Balanced)</option>
                        <option value="anthropic/claude-3-haiku">Sarathi Flash (Fastest)</option>
                    </select>
                </div>
                <div class="setting-group action-buttons">
                    <button class="btn-secondary" id="exportDataBtn">Export All Data (JSON)</button>
                    <button class="btn-danger" id="clearDataBtn">Clear History</button>
                </div>
            </div>
        </div>
    </dialog>

    <!-- Modal Plans Dialog -->
    <dialog class="modal" id="plansModal">
        <div class="modal-content">
            <header class="modal-header">
                <h2>Plans</h2>
                <button class="icon-btn" id="closePlansBtn">✕</button>
            </header>
            <div class="modal-body">
                <div class="plan-cards" id="planCardsContainer">
                    <!-- Populated by app.js from /api/plan -->
                </div>
                <p class="plans-note">Demo plans for this project — no real payment is collected when you switch.</p>
            </div>
        </div>
    </dialog>

    <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
